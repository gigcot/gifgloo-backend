# Include this inside the API server block before the proxy location.

location ~* ^/(?:\.env|\.git|\.svn|\.hg|composer\.(?:json|lock)|package(?:-lock)?\.json)$ {
    access_log off;
    return 444;
}

location ~* \.(?:php|phar|phtml|asp|aspx|jsp|cgi)(?:/|$) {
    access_log off;
    return 444;
}

location ~* ^/(?:wp-admin|wp-content|wp-includes|wordpress|phpmyadmin|pma|vendor|server-status)(?:/|$) {
    access_log off;
    return 444;
}
