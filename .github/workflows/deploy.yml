name: Deploy to EC2

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}
  AWS_REGION: ap-northeast-2

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      lambda_ai: ${{ steps.filter.outputs.lambda_ai }}
      lambda_gif: ${{ steps.filter.outputs.lambda_gif }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - '.github/workflows/deploy.yml'
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-compose.prod.yml'
              - 'alembic.ini'
              - 'migrations/**'
              - 'requirements.txt'
              - 'main.py'
              - 'asset/**'
              - 'audit/**'
              - 'composition/**'
              - 'config/**'
              - 'credit_account/**'
              - 'payment/**'
              - 'shared/**'
              - 'user/**'
              - 'monitoring/**'
              - 'ops/nginx/**'
              - 'tests/api_tests/**'
              - 'tests/composition/unit_tests/**'
              - 'tests/integration_tests/**'
            lambda_ai:
              - 'lambda/deploy.sh'
              - 'lambda/ai_processor/**'
            lambda_gif:
              - 'lambda/deploy.sh'
              - 'lambda/build_layer.sh'
              - 'lambda/gif_processor/**'
              - 'lambda/layer/**'

  ci:
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.lambda_ai == 'true' || needs.changes.outputs.lambda_gif == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gifgloo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gifgloo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gifgloo_test
      ASYNC_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/gifgloo_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gifgloo_test
      CORS_ORIGINS: http://localhost:3000
      COOKIE_SECURE: "false"
      JWT_SECRET_KEY: test-secret
      INTERNAL_SECRET: test-internal-secret
      BACKEND_CALLBACK_URL: http://localhost:8000
      FRONTEND_CALLBACK_URL: http://localhost:3000/callback
      KAKAO_RESTAPI_KEY: test
      KAKAO_CLIENT_SECRET: test
      KAKAO_REDIRECT_URI: http://localhost:8000/oauth/kakao/callback
      GOOGLE_RESTAPI_KEY: test
      GOOGLE_CLIENT_SECRET: test
      GOOGLE_REDIRECT_URI: http://localhost:8000/oauth/google/callback
      R2_ENDPOINT_URL: http://localhost:9000
      R2_ACCESS_KEY_ID: test
      R2_SECRET_ACCESS_KEY: test
      R2_BUCKET_NAME: gifgloo-test
      R2_PUBLIC_URL: http://localhost:9000/gifgloo-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m compileall -q \
            main.py \
            asset \
            audit \
            composition \
            config \
            credit_account \
            payment \
            shared \
            user \
            migrations \
            lambda/ai_processor \
            lambda/gif_processor \
            tests/api_tests \
            tests/composition/unit_tests \
            tests/integration_tests

      - name: Run unit tests
        run: python -m unittest discover -s tests/composition/unit_tests -p 'test_*.py'

      - name: Run API smoke tests
        if: needs.changes.outputs.app == 'true'
        run: python -m unittest discover -s tests/api_tests -p 'test_*.py'

      - name: Run database migrations
        if: needs.changes.outputs.app == 'true'
        run: alembic upgrade head

      - name: Run database integration tests
        if: needs.changes.outputs.app == 'true'
        run: python -m unittest discover -s tests/integration_tests -p 'test_*.py'

      - name: Import FastAPI app
        if: needs.changes.outputs.app == 'true'
        run: python -c "import main; print('app import ok')"

      - name: Validate production compose
        if: needs.changes.outputs.app == 'true'
        run: |
          touch .env
          BACKEND_IMAGE="${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f monitoring/docker-compose.yml config --quiet

      - name: Check Docker build
        if: needs.changes.outputs.app == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false

  build:
    needs: [changes, ci]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [changes, build]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get runner public IP
        id: ip
        uses: haythem/public-ip@v1.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Allow runner SSH access
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.AWS_SECURITY_GROUP_ID }}" \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.ip.outputs.ipv4 }}/32" || true

      - name: Upload production deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,monitoring,ops/nginx"
          target: "~/gifgloo-backend"
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd ~/gifgloo-backend
            if [ -n "${{ secrets.GHCR_USER }}" ] && [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin
            fi
            export BACKEND_IMAGE="${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
            sudo systemctl stop gifgloo || true
            sudo systemctl disable gifgloo || true
            mkdir -p /tmp/gifgloo-node-exporter
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml run --rm --no-deps app alembic upgrade head
            docker compose -f docker-compose.prod.yml up -d app
            docker compose --env-file .env -f monitoring/docker-compose.yml up -d
            docker image prune -f
            if [ -n "${{ secrets.GHCR_USER }}" ] && [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              docker logout ghcr.io
            fi

      - name: Revoke runner SSH access
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.AWS_SECURITY_GROUP_ID }}" \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.ip.outputs.ipv4 }}/32" || true

  deploy-lambda:
    needs: [changes, ci]
    if: needs.changes.outputs.lambda_ai == 'true' || needs.changes.outputs.lambda_gif == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-northeast-2
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
      LAMBDA_LAYER_BUCKET: ${{ secrets.LAMBDA_LAYER_BUCKET }}
      LAMBDA_ROLE_ARN: ${{ secrets.LAMBDA_ROLE_ARN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Deploy gif processor Lambda
        if: needs.changes.outputs.lambda_gif == 'true'
        run: bash lambda/deploy.sh gif --function-only

      - name: Deploy ai processor Lambda
        if: needs.changes.outputs.lambda_ai == 'true'
        run: bash lambda/deploy.sh ai
